
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MRCS DRM{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 4px;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #c0392b;
    }

    .subtext {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555555;
    }

    table.details {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table.details td {
      padding: 6px 8px;
      border-bottom: 1px solid #eeeeee;
      vertical-align: top;
    }

    table.details td.label {
      width: 40%;
      font-weight: bold;
      color: #444444;
    }

    table.details td.value {
      width: 60%;
      color: #000000;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #aaaaaa;
    }

    @media only screen and (max-width: 600px) {
      .container { padding: 16px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      {% block header %}{% endblock %}
    </div>

    <div class="subtext">
      {% block subtext %}{% endblock %}
    </div>

    {% block content %}
    {% endblock %}

    <div class="footer">
      This message was sent automatically by the MRCS Disaster Risk Management system.
      Please do not reply to this email.
    </div>

  </div>
</body>
</html>
