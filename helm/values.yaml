app:
  environment: PROD
  # The app reads APP_TYPE (uppercased). The chart injects it per component
  # (web/worker/hook/cronjob), so it is NOT set statically under `env` below.
  appTypeEnvName: "APP_TYPE"
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["misc/prod/run_web.sh"]
    probes:
      enabled: true    # chart defaults: liveness /healthz/live/, readiness+startup /healthz/ready/
    ingress:
      enabled: true
      # className is not hardcoded; set it per-environment (e.g. values/traefik.yaml).
      className:
      host:
      annotations:
    resources:
      requests:
        cpu: "0.3"
        memory: 0.4Gi
      limits:
        memory: 1Gi

  worker:
    enabled: false
    queueDefaults:
      commandPrefix:
        - "celery"
        - "-A"
        - "main"
        - "worker"
        - "-l"
        - "INFO"
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs:
          - "-Q"
          - "default"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"
    addons:
      beat:
        enabled: false
        replicaCount: 1
        strategy: {type: Recreate}
        # In-code beat_schedule (no django-celery-beat) -> persistent scheduler.
        command:
          - "celery"
          - "-A"
          - "main"
          - "beat"
          - "-l"
          - "INFO"
          - "--scheduler"
          - "banjo_utils.celery_health.persistent.HeartbeatPersistentScheduler"
        extraEnv:
          BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
        volumes:
          celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        volumeMounts:
          celery-heartbeat: {mountPath: /var/run/celery}
        probes:
          enabled: true
          liveness:
            # persistent scheduler ticks less often -> --max-age "360"
            exec: {command: [banjo-celery-probe, --max-age, "360"]}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3

  # db-migrate and collect-static inherit chart defaults (Sync hooks @ wave 20);
  # only wait-for-resources is overridden with this repo's flags.
  hooks:
    enabled: true
    jobs:
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker"]

  # NOTE: Check main/settings.py for all available options
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    # AWS
    AWS_S3_ENABLED: "false"
    # Sentry
    SENTRY_ENABLED: "false"
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"
    # App-domain vars (APP_DOMAIN, FRONTEND_DOMAIN, SESSION_COOKIE_DOMAIN,
    # CSRF_COOKIE_DOMAIN) are set per-environment; see main/settings.py for options.

  # NOTE: Check main/settings.py for all available options. Required secrets
  # (DJANGO_SECRET_KEY, SENTRY_DSN) are provided per-environment (CICD /
  # values/<env>.yaml), not defaulted here.
  secrets: {}
