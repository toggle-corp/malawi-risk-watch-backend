app:
  environment: PROD
  appTypeEnvName: "APP_TYPE"
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"

  redis:
    enabled: false

  # PostgreSQL is managed externally (Azure Database for PostgreSQL Flexible Server).
  # Connection details are injected as secrets — no in-cluster postgres.
  postgresql:
    enabled: false

  minio:
    enabled: false

  api:
    enabled: true
    replicaCount: 1
    containerPort: 80
    command: ["misc/prod/run_web.sh"]
    resources:
      requests:
        cpu: "0.3"
        memory: 0.4Gi
      limits:
        cpu: "0.5"
        memory: 1Gi

  worker:
    enabled: false

  argoHook:
    enabled: true
    resources:
      requests:
        cpu: "0.1"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    hooks:
      db-migrate:
        enabled: true
        hook: PostSync
        preserveHistory: true
        command: ["/bin/bash", "-c", "./manage.py wait_for_resources --db && ./manage.py migrate"]
      collect-static:
        enabled: true
        hook: PostSync
        command: ["/bin/bash", "-c", "./manage.py collectstatic --noinput"]

  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    APP_TYPE: "WEB"
    # Azure Blob Storage (S3-compatible)
    AWS_S3_ENABLED: "true"
    AWS_S3_MEDIA_BUCKET_NAME: "mrcs-media"
    AWS_S3_STATIC_BUCKET_NAME: "mrcs-static"
    # Domains — must be overridden per environment
    APP_DOMAIN: "{{ required \".app.env.APP_DOMAIN\" nil }}"
    FRONTEND_DOMAIN: "{{ required \".app.env.FRONTEND_DOMAIN\" nil }}"
    SESSION_COOKIE_DOMAIN: "{{ required \".app.env.SESSION_COOKIE_DOMAIN\" nil }}"
    CSRF_COOKIE_DOMAIN: "{{ required \".app.env.CSRF_COOKIE_DOMAIN\" nil }}"

  secrets:
    DJANGO_SECRET_KEY: "{{ required \".Values.secrets.DJANGO_SECRET_KEY\" nil }}"
    # Azure Database for PostgreSQL Flexible Server
    POSTGRES_DB: "{{ required \".Values.secrets.POSTGRES_DB\" nil }}"
    POSTGRES_USER: "{{ required \".Values.secrets.POSTGRES_USER\" nil }}"
    POSTGRES_PASSWORD: "{{ required \".Values.secrets.POSTGRES_PASSWORD\" nil }}"
    POSTGRES_HOST: "{{ required \".Values.secrets.POSTGRES_HOST\" nil }}"
    POSTGRES_PORT: "5432"
    # Azure Blob Storage credentials
    AWS_S3_ENDPOINT_URL: "{{ required \".Values.secrets.AWS_S3_ENDPOINT_URL\" nil }}"
    AWS_S3_ACCESS_KEY_ID: "{{ required \".Values.secrets.AWS_S3_ACCESS_KEY_ID\" nil }}"
    AWS_S3_SECRET_ACCESS_KEY: "{{ required \".Values.secrets.AWS_S3_SECRET_ACCESS_KEY\" nil }}"
    AWS_S3_REGION_NAME: "{{ required \".Values.secrets.AWS_S3_REGION_NAME\" nil }}"
