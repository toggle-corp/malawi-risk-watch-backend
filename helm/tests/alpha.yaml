app:
  environment: ALPHA

  ingress:
    enabled: true
    className: nginx
    host: test.malawi.example.com
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"

  postgresql:
    enabled: true
    fullnameOverride: "malawi-postgresql"
    architecture: standalone
    auth:
      postgresPassword: "test-password"
      database: "malawi"

  env:
    APP_DOMAIN: https://malawi.test.example.com
    FRONTEND_DOMAIN: https://malawi-frontend.test.example.com
    SESSION_COOKIE_DOMAIN: .example.com
    CSRF_COOKIE_DOMAIN: .example.com
    AWS_S3_ENABLED: "false"

  secrets:
    DJANGO_SECRET_KEY: "django-secret-key-for-tests"
    POSTGRES_DB: "malawi"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "test-password"
    POSTGRES_HOST: "malawi-postgresql"
    POSTGRES_PORT: "5432"
    AWS_S3_ENDPOINT_URL: ""
    AWS_S3_ACCESS_KEY_ID: ""
    AWS_S3_SECRET_ACCESS_KEY: ""
    AWS_S3_REGION_NAME: "eastus"
