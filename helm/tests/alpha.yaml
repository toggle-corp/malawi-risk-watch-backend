#TODO(@sudip-khanal): update this file after alpha deployment.
app:
  environment: ALPHA

  ingress:
    enabled: true
    className: nginx
    host: test.mrcs.com
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"

  redis:
    enabled: true
    architecture: standalone
    fullnameOverride: mrcs-redis
    auth:
      enabled: false

  postgresql:
    enabled: true
    fullnameOverride: "mrcs-postgresql"
    architecture: standalone
    auth:
      postgresPassword: "test-password"
      password: "test"


  minio:
    enabled: true
    tls:
      enabled: false
    apiIngress:
      hostname: mrcs-minio.test.com
    auth:
      rootPassword: test-password

  env:
    APP_DOMAIN: https://mrcs.test.com
    APP_RELEASE:  https://mrcs.test.com
    FRONTEND_DOMAIN: https://mrcs-frontend.test.com
    SESSION_COOKIE_DOMAIN: .example.com
    CSRF_COOKIE_DOMAIN: .example.com
    # AWS
    AWS_S3_ENABLED: "false"
    # Sentry
    SENTRY_ENABLED: "true"

  secrets:
    DJANGO_SECRET_KEY: "django-secret-key"
    SENTRY_DSN: https://sentry.mrcs.test.com
    DEFAULT_FROM_EMAIL: test
    EMAIL_HOST: test
    EMAIL_PORT: "1025"
    EMAIL_HOST_USER: test
    EMAIL_HOST_PASSWORD: test
