app:
  image:
    name: local.git.com/toggle-corp/malawi-backend
    tag: develop.xxxxxxxx

  api:
    ingress:
      host: mrcs-api.test.example.com

  env:
    APP_DOMAIN: "https://mrcs-api.test.example.com"
    FRONTEND_DOMAIN: "https://mrcs.test.example.com"
    SESSION_COOKIE_DOMAIN: ".example.com"
    CSRF_COOKIE_DOMAIN: ".example.com"

  # POSTGRES_PASSWORD and the AWS_S3_* credentials are consumed via extraEnvVars
  # valueFrom (cluster Secrets), so they are not set here.
  secrets:
    DJANGO_SECRET_KEY: "django-secret-key"
    SENTRY_DSN: "https://xyz@sentry.test.example.com/1"
    DEFAULT_FROM_EMAIL: "mrcs-drm@test.example.com"
    EMAIL_HOST: "smtp.test.example.com"
    EMAIL_PORT: "587"
    EMAIL_HOST_USER: "mrcs"
    EMAIL_HOST_PASSWORD: "email-password"
