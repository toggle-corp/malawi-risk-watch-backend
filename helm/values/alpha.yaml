app:
  environment: ALPHA

  api:
    ingress:
      enabled: true
      className: nginx

  worker:
    enabled: true
    addons:
      beat:
        enabled: true

  # collect-static needs S3/minio reachable; gate it alongside the DB/cache/broker.
  hooks:
    enabled: true
    jobs:
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker", "--minio"]

  env:
    # AWS (S3 via cluster minio)
    AWS_S3_ENABLED: "true"
    AWS_S3_ENDPOINT_URL: "{{ required \".app.env.AWS_S3_ENDPOINT_URL\" nil }}"
    AWS_S3_MEDIA_BUCKET_NAME: "mrcs-media"
    AWS_S3_STATIC_BUCKET_NAME: "mrcs-static"
    # Sentry
    SENTRY_ENABLED: "true"

  secrets:
    # Postgres — provided externally (service `tcpg`, secret tcpg-pg-credential)
    POSTGRES_DB: "postgres"
    POSTGRES_USER: "postgres"
    POSTGRES_HOST: "tcpg"
    POSTGRES_PORT: "5432"
    # Minio (S3)
    AWS_S3_REGION_NAME: "us-east-1"
    # Email
    EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
    DEFAULT_FROM_EMAIL: "{{ required \".app.secrets.DEFAULT_FROM_EMAIL\" nil }}"
    EMAIL_HOST: "{{ required \".app.secrets.EMAIL_HOST\" nil }}"
    EMAIL_PORT: "{{ required \".app.secrets.EMAIL_PORT\" nil }}"
    EMAIL_HOST_USER: "{{ required \".app.secrets.EMAIL_HOST_USER\" nil }}"
    EMAIL_HOST_PASSWORD: "{{ required \".app.secrets.EMAIL_HOST_PASSWORD\" nil }}"
