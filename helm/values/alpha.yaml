app:
  environment: ALPHA

  api:
    ingress:
      enabled: true

  worker:
    enabled: true
    addons:
      beat:
        enabled: true

  # collect-static needs S3/minio reachable; gate it alongside the DB/cache/broker.
  hooks:
    enabled: true
    jobs:
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker", "--minio"]

  # Infra credentials are provided by the cluster as fixed-name Secrets
  # (tcpg-pg-credential, minio-s3-credential); consume them by reference rather
  # than duplicating the values into this repo. Note: the Postgres instance must
  # run a PostGIS image (this app uses django.contrib.gis.db.backends.postgis).
  extraEnvVars:
    POSTGRES_PASSWORD:
      valueFrom:
        secretKeyRef: {name: tcpg-pg-credential, key: POSTGRES_PASSWORD}
    AWS_S3_ENDPOINT_URL:
      valueFrom:
        secretKeyRef: {name: minio-s3-credential, key: S3_ENDPOINT_URL}
    AWS_S3_REGION_NAME:
      valueFrom:
        secretKeyRef: {name: minio-s3-credential, key: S3_REGION}
    AWS_S3_ACCESS_KEY_ID:
      valueFrom:
        secretKeyRef: {name: minio-s3-credential, key: S3_ACCESS_KEY_ID}
    AWS_S3_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef: {name: minio-s3-credential, key: S3_SECRET_ACCESS_KEY}

  env:
    # AWS (S3 via cluster minio; endpoint/region/keys via extraEnvVars above)
    AWS_S3_ENABLED: "true"
    AWS_S3_MEDIA_BUCKET_NAME: "mrcs-media"
    AWS_S3_STATIC_BUCKET_NAME: "mrcs-static"
    # Sentry
    SENTRY_ENABLED: "true"

  secrets:
    # Postgres — provided externally; host/port below, password via extraEnvVars
    POSTGRES_DB: "postgres"
    POSTGRES_USER: "postgres"
    POSTGRES_HOST: "tcpg"
    POSTGRES_PORT: "5432"
    # Email
    EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
    # SMTP creds (DEFAULT_FROM_EMAIL, EMAIL_HOST/PORT/HOST_USER/HOST_PASSWORD) are
    # provided per-environment (CICD); see main/settings.py for options.
